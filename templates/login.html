{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - LibroLibre</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a href="/" class="nav-logo">
                <div class="nav-logo-icon">📚</div>
                LibroLibre
            </a>
            <h2>Bienvenido de vuelta</h2>
            <p class="subtitle">Ingresa con tu correo institucional</p>

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}

                {% if form.errors %}
                <div class="toast toast-error" style="animation:none;margin-bottom:1rem;pointer-events:auto;font-size:0.85rem;">
                    <span class="toast-icon">✗</span>
                    <span>Correo o contraseña incorrectos</span>
                </div>
                {% endif %}

                <div class="form-group">
                    <label for="email">Correo institucional</label>
                    <input type="email" id="email" name="email"
                           placeholder="ejemplo@universidad.edu" required
                           autocomplete="email" autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <div style="position:relative;">
                        <input type="password" id="password" name="password"
                               placeholder="••••••••" required
                               autocomplete="current-password">
                        <button type="button" class="password-toggle btn-icon"
                                data-target="password"
                                style="position:absolute;right:8px;top:50%;transform:translateY(-50%);
                                       background:none;border:none;cursor:pointer;font-size:1rem;padding:4px;"
                                aria-label="Mostrar contraseña">👁</button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-lg btn-full">
                    Iniciar Sesión
                </button>
            </form>

            <div class="auth-divider">o</div>

            <div class="auth-footer">
                ¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a>
            </div>
        </div>
    </div>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
